name: Flutter CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Format
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tool/check_changed_dart_format.sh
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and widget tests
        run: flutter test --exclude-tags=device
